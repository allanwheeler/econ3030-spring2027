[project]
name = "econ3030-spring2027"
version = "0.1.0"
description = "Introductory applied data analysis at CSU Bakersfield"
requires-python = ">=3.12,<3.14"
dependencies = [
    "polars>=1.35,<2",
    "altair>=5.5,<6",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "pyyaml>=6,<7",
    "vl-convert-python>=1.8,<2",
]

[tool.uv]
package = false
